<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コーディネート表示</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #558dd8;
            --primary-light: #7ba8e5;
            --primary-dark: #3d6ba8;
            --primary-bg: rgba(85, 141, 216, 0.1);
        }
        
        body {
            font-family: 'Noto Sans JP', Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0f8 0%, #d0e0f0 50%, #b8d0e8 100%);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* パーティクル背景 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(85, 141, 216, 0.4);
            border-radius: 50%;
            animation: float 20s infinite;
            box-shadow: 0 0 10px rgba(85, 141, 216, 0.5);
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .coordinate-container {
            position: relative;
            z-index: 10;
            background: #ffffff;
            border-radius: 24px;
            padding: 4px;
            max-width: 750px;
            width: 100%;
            animation: cardAppear 0.8s ease-out;
            overflow: hidden;
            box-shadow: 
                0 20px 60px rgba(85, 141, 216, 0.25),
                0 0 0 1px rgba(85, 141, 216, 0.1) inset;
        }
        
        /* カードの縁取りエフェクト */
        .card-border-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light), var(--primary-color));
            background-size: 200% 200%;
            animation: borderGlow 3s ease infinite;
            z-index: -1;
            opacity: 0.6;
        }
        
        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .card-inner {
            padding: 35px;
            position: relative;
            z-index: 2;
            background: #ffffff;
            border-radius: 20px;
            height: 100%;
        }
        
        /* カードの角の装飾 */
        .card-corner {
            position: absolute;
            width: 80px;
            height: 80px;
            z-index: 3;
            pointer-events: none;
        }
        
        .corner-top-left {
            top: 0;
            left: 0;
            background: radial-gradient(circle at top left, rgba(85, 141, 216, 0.2), transparent 70%);
            border-radius: 24px 0 0 0;
        }
        
        .corner-top-right {
            top: 0;
            right: 0;
            background: radial-gradient(circle at top right, rgba(85, 141, 216, 0.2), transparent 70%);
            border-radius: 0 24px 0 0;
        }
        
        .corner-bottom-left {
            bottom: 0;
            left: 0;
            background: radial-gradient(circle at bottom left, rgba(85, 141, 216, 0.2), transparent 70%);
            border-radius: 0 0 0 24px;
        }
        
        .corner-bottom-right {
            bottom: 0;
            right: 0;
            background: radial-gradient(circle at bottom right, rgba(85, 141, 216, 0.2), transparent 70%);
            border-radius: 0 0 24px 0;
        }
        
        /* キラキラエフェクト */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleFloat 3s ease-in-out infinite;
            box-shadow: 0 0 6px var(--primary-color);
        }
        
        @keyframes sparkleFloat {
            0%, 100% {
                opacity: 0;
                transform: translateY(0) scale(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-30px) scale(1);
            }
        }
        
        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: perspective(1000px) rotateY(-90deg) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: perspective(1000px) rotateY(0deg) scale(1);
            }
        }
        
        .coordinate-image-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin: 25px 0 30px 0;
            border: 3px solid var(--primary-color);
            box-shadow: 
                0 8px 30px rgba(85, 141, 216, 0.3),
                inset 0 0 20px rgba(85, 141, 216, 0.1);
            background: linear-gradient(135deg, rgba(85, 141, 216, 0.05), rgba(123, 168, 229, 0.05));
        }
        
        /* 画像の光るエフェクト */
        .image-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(85, 141, 216, 0.1),
                transparent
            );
            animation: imageShine 4s infinite;
            pointer-events: none;
            z-index: 1;
        }
        
        @keyframes imageShine {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }
        
        .coordinate-image {
            width: 100%;
            display: block;
            border-radius: 10px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        
        .coordinate-image.loaded {
            opacity: 1;
            transform: scale(1);
            animation: imageReveal 1s ease-out;
        }
        
        @keyframes imageReveal {
            0% {
                opacity: 0;
                transform: scale(0.9) rotateY(-10deg);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
                filter: blur(0);
            }
        }
        
        .error-message {
            color: #e74c3c;
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe5e5 100%);
            border-radius: 15px;
            margin-top: 20px;
            border: 2px solid #e74c3c;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.2);
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--primary-color);
            font-size: 18px;
            font-weight: 700;
        }
        
        /* ローディングスピナー */
        .spinner {
            width: 60px;
            height: 60px;
            margin: 20px auto;
            border: 5px solid rgba(85, 141, 216, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ヘッダーセクション */
        .card-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(85, 141, 216, 0.15);
            position: relative;
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .logo {
            height: 60px;
            width: auto;
            object-fit: contain;
            animation: logoAppear 0.8s ease-out backwards;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }
        
        .logo-japanese {
            animation-delay: 0.2s;
        }
        
        .logo-english {
            animation-delay: 0.4s;
        }
        
        @keyframes logoAppear {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .app-name {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 12px;
            letter-spacing: 3px;
            text-shadow: 0 2px 8px rgba(85, 141, 216, 0.2);
        }
        
        .exhibit-number {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-dark);
            padding: 10px 25px;
            background: linear-gradient(135deg, var(--primary-bg), rgba(123, 168, 229, 0.1));
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(85, 141, 216, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .exhibit-number::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        /* フッターセクション */
        .card-footer {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px solid rgba(85, 141, 216, 0.15);
        }
        
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        
        .tag {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 
                0 4px 12px rgba(85, 141, 216, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            transition: all 0.3s ease;
            cursor: default;
            animation: tagAppear 0.6s ease-out backwards;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .tag::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: tagShine 2.5s infinite;
        }
        
        @keyframes tagShine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .tag:nth-child(1) { animation-delay: 0.2s; }
        .tag:nth-child(2) { animation-delay: 0.4s; }
        .tag:nth-child(3) { animation-delay: 0.6s; }
        
        @keyframes tagAppear {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .coordinate-container {
                max-width: 100%;
            }
            
            .card-inner {
                padding: 20px;
            }
            
            .card-header {
                margin-bottom: 20px;
                padding-bottom: 20px;
            }
            
            .logo {
                height: 45px;
            }
            
            .app-name {
                font-size: 24px;
                letter-spacing: 2px;
            }
            
            .exhibit-number {
                font-size: 13px;
                padding: 8px 18px;
            }
            
            .tag {
                font-size: 11px;
                padding: 8px 16px;
            }
            
            .coordinate-image-wrapper {
                margin: 20px 0 25px 0;
            }
        }
    </style>
</head>
<body>
    <!-- パーティクル背景 -->
    <div class="particles" id="particles"></div>
    
    <div class="coordinate-container" data-image-url="{% if image_url %}{{ image_url }}{% endif %}">
        <div class="card-border-glow"></div>
        <div class="card-corner corner-top-left"></div>
        <div class="card-corner corner-top-right"></div>
        <div class="card-corner corner-bottom-left"></div>
        <div class="card-corner corner-bottom-right"></div>
        
        <div class="card-inner">
            <!-- ヘッダーセクション -->
            <div class="card-header">
                <div class="logo-container">
                    <img src="/static/images/j_logo.jpg" alt="スマクロ ロゴ（日本語）" class="logo logo-japanese">
                    <img src="/static/images/e_logo.jpg" alt="SMA CLO Logo (English)" class="logo logo-english">
                </div>
                <div class="app-name">スマクロ</div>
                <div class="exhibit-number">IT:HAL439</div>
            </div>
            
            <!-- 画像セクション -->
            <div id="loadingMessage" class="loading">
                <div class="spinner"></div>
                <div>画像を読み込み中...</div>
            </div>
            
            <div class="coordinate-image-wrapper">
                <div class="image-glow"></div>
                <img id="coordinateImage" class="coordinate-image" alt="コーディネート画像">
            </div>
            
            <!-- フッターセクション -->
            <div class="card-footer">
                <div class="tags-container">
                    <span class="tag">#未来創造展2026</span>
                    <span class="tag">#H439</span>
                    <span class="tag">#スマクロAIコーデ</span>
                </div>
            </div>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>
    </div>
    
    <script>
        // パーティクル生成
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 15) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // キラキラエフェクトを生成
        function createSparkles() {
            const container = document.querySelector('.coordinate-container');
            const sparkleCount = 20;
            
            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (2 + Math.random() * 3) + 's';
                container.appendChild(sparkle);
            }
        }
        
        const imageElement = document.getElementById('coordinateImage');
        const loadingMessage = document.getElementById('loadingMessage');
        const errorMessage = document.getElementById('errorMessage');
        const container = document.querySelector('.coordinate-container');
        
        // エフェクトを生成
        createParticles();
        createSparkles();
        
        // Flaskテンプレート変数から画像URLを取得（data属性から）
        let imageUrl = container.getAttribute('data-image-url');
        
        // data属性に値がない場合、URLパラメータから取得
        if (!imageUrl || imageUrl === '') {
            const urlParams = new URLSearchParams(window.location.search);
            imageUrl = urlParams.get('image_url');
        }
        
        if (imageUrl) {
            // 画像の読み込み処理
            imageElement.onload = function() {
                setTimeout(() => {
                    loadingMessage.style.display = 'none';
                    imageElement.classList.add('loaded');
                }, 300);
            };
            
            imageElement.onerror = function() {
                loadingMessage.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.textContent = '画像の読み込みに失敗しました。画像が見つからないか、URLが正しくありません。';
            };
            
            // 相対パスの場合は絶対パスに変換
            let finalImageUrl = imageUrl;
            if (!imageUrl.startsWith('http://') && !imageUrl.startsWith('https://') && !imageUrl.startsWith('/')) {
                finalImageUrl = '/' + imageUrl;
            }
            
            imageElement.src = finalImageUrl;
        } else {
            loadingMessage.style.display = 'none';
            errorMessage.style.display = 'block';
            errorMessage.textContent = '画像URLが指定されていません。';
        }
        
    </script>
</body>
</html>
